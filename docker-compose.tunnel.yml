version: '3.8'

# ==============================================================================
# Production Cloudflare Tunnel Stack (Local Computer / Self-Hosted)
# ==============================================================================
# Use this when running on a local desktop/laptop/homelab machine behind a cloud tunnel.
# No router port forwarding, no static IP, and no open ports (80/443) required!
#
# Usage:
#   docker compose -f docker-compose.prod.yml -f docker-compose.tunnel.yml --env-file .env.production up -d --build
# ==============================================================================

services:
  # Disable public host port binding for Caddy when running behind Cloudflare Tunnel
  # (Cloudflare edge terminates HTTPS and routes traffic internally to web:3000)
  caddy:
    profiles: ["with-caddy"] # Only starts if explicitly requested; tunnel replaces Caddy

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: db_platform_tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?Error: CLOUDFLARE_TUNNEL_TOKEN is required in .env.production}
    depends_on:
      web:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
