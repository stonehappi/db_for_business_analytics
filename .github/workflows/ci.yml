name: CI & Production Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Lint, Test & Verify
    runs-on: ubuntu-latest

    services:
      postgres-app:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      postgres-sandbox:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sandbox_db
          STUDENT_SANDBOX_PASSWORD: sandbox_safe_pw
        ports:
          - 5435:5432
        volumes:
          - ${{ github.workspace }}/docker/init-sandbox.sh:/docker-entrypoint-initdb.d/init-sandbox.sh:ro
        options: >-
          --health-cmd "pg_isready -U postgres -d sandbox_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Database Migrations & Seeds
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_db
          SANDBOX_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5435/sandbox_db
          SANDBOX_STUDENT_DATABASE_URL: postgresql://student_sandbox_user:sandbox_safe_pw@localhost:5435/sandbox_db
          JWT_SECRET: ci-jwt-test-secret-key-32-chars-long-minimum-2026
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Build Next.js Application
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_db
          SANDBOX_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5435/sandbox_db
          SANDBOX_STUDENT_DATABASE_URL: postgresql://student_sandbox_user:sandbox_safe_pw@localhost:5435/sandbox_db
          JWT_SECRET: ci-jwt-test-secret-key-32-chars-long-minimum-2026
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_db
          SANDBOX_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5435/sandbox_db
          SANDBOX_STUDENT_DATABASE_URL: postgresql://student_sandbox_user:sandbox_safe_pw@localhost:5435/sandbox_db
          JWT_SECRET: ci-jwt-test-secret-key-32-chars-long-minimum-2026
        run: npm run test:e2e

      - name: Test Docker Container Build
        run: docker build -t db_platform_web:ci .
