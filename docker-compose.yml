# ==============================================================================
# Production Docker Compose Stack
# ==============================================================================
# Hardened production architecture:
# - Caddy reverse proxy: Only service exposing HTTP port (configurable via PORT or APP_PORT, default 80)
# - Private network: Web, postgres-app, postgres-sandbox, and backup run privately
# - Resource limits, JSON log rotation, PostgreSQL tuning & statement timeouts
# - In-container automated database backups with 30-day retention & S3/R2 sync
#
# Usage:
#   docker compose --env-file .env.production up -d --build
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Reverse Proxy (Caddy) - HTTP Port (default 80, configurable via PORT/APP_PORT)
  # ----------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: db_platform_caddy
    restart: always
    ports:
      - "${APP_PORT:-${PORT:-80}}:80"
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      web:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Next.js Application Server (Standalone Production Image)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    image: db_platform_web:latest
    container_name: db_platform_web
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_APP_USER:-postgres}:${POSTGRES_APP_PASSWORD}@postgres-app:5432/${POSTGRES_APP_DB:-app_db}
      - SANDBOX_ADMIN_DATABASE_URL=postgresql://${POSTGRES_SANDBOX_USER:-postgres}:${POSTGRES_SANDBOX_PASSWORD}@postgres-sandbox:5432/${POSTGRES_SANDBOX_DB:-sandbox_db}
      - SANDBOX_STUDENT_DATABASE_URL=postgresql://${STUDENT_SANDBOX_USER:-student_sandbox_user}:${STUDENT_SANDBOX_PASSWORD:-sandbox_safe_pw}@postgres-sandbox:5432/${POSTGRES_SANDBOX_DB:-sandbox_db}
      - JWT_SECRET=${JWT_SECRET}
      - AUTO_MIGRATE=${AUTO_MIGRATE:-true}
      - AUTO_SEED=${AUTO_SEED:-false}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      postgres-app:
        condition: service_healthy
      postgres-sandbox:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Application Database (Primary OLTP)
  # ----------------------------------------------------------------------------
  postgres-app:
    image: postgres:16-alpine
    container_name: db_platform_postgres_app
    restart: always
    # Optimized PostgreSQL runtime parameters for analytics & OLTP workloads
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    # Internal private network only - zero host port exposure
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_APP_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_DB: ${POSTGRES_APP_DB:-app_db}
    volumes:
      - postgres_app_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Sandbox Database (Student Query Execution & Verification)
  # ----------------------------------------------------------------------------
  postgres-sandbox:
    image: postgres:16-alpine
    container_name: db_platform_postgres_sandbox
    restart: always
    # Enforce database daemon-level hard limits on student execution sandbox
    command: >
      postgres
      -c statement_timeout=3000
      -c lock_timeout=2000
      -c idle_in_transaction_session_timeout=5000
      -c work_mem=16MB
      -c temp_file_limit=50MB
    # Internal private network only - zero host port exposure
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_SANDBOX_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SANDBOX_PASSWORD}
      POSTGRES_DB: ${POSTGRES_SANDBOX_DB:-sandbox_db}
      STUDENT_SANDBOX_PASSWORD: ${STUDENT_SANDBOX_PASSWORD:-sandbox_safe_pw}
    volumes:
      - postgres_sandbox_data:/var/lib/postgresql/data
      - ./docker/init-sandbox.sh:/docker-entrypoint-initdb.d/init-sandbox.sh:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # In-Container Automated Database Backup Service
  # ----------------------------------------------------------------------------
  # Automatically dumps app_db and sandbox_db inside Docker without host cron.
  # Backups are stored in ./backups on the host with 30-day auto-retention.
  # ----------------------------------------------------------------------------
  backup:
    image: postgres:16-alpine
    container_name: db_platform_backup
    restart: always
    environment:
      POSTGRES_APP_HOST: postgres-app
      POSTGRES_APP_PORT: 5432
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-postgres}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_APP_DB: ${POSTGRES_APP_DB:-app_db}
      POSTGRES_SANDBOX_HOST: postgres-sandbox
      POSTGRES_SANDBOX_PORT: 5432
      POSTGRES_SANDBOX_USER: ${POSTGRES_SANDBOX_USER:-postgres}
      POSTGRES_SANDBOX_PASSWORD: ${POSTGRES_SANDBOX_PASSWORD}
      POSTGRES_SANDBOX_DB: ${POSTGRES_SANDBOX_DB:-sandbox_db}
      BACKUP_CRON_SCHEDULE: ${BACKUP_CRON_SCHEDULE:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-auto}
    volumes:
      - ./backups:/backups
      - ./docker/backup-service.sh:/usr/local/bin/backup-service.sh:ro
      - ./docker/backup-entrypoint.sh:/usr/local/bin/backup-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-entrypoint.sh"]
    depends_on:
      postgres-app:
        condition: service_healthy
      postgres-sandbox:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_app_data:
  postgres_sandbox_data:
  caddy_data:
  caddy_config:
